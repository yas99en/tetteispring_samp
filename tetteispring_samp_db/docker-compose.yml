services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      # タイムゾーン
      TZ: Asia/Tokyo

      # ICU ロケール指定（重要）
      POSTGRES_INITDB_ARGS: >
        --encoding=UTF8
        --lc-ctype=C
        --lc-collate=C
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
